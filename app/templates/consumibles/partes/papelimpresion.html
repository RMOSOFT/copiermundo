
{# templates/consumibles/partes/papelimpresion.html #}
<div class="table-responsive">
  <table class="table">
    <thead><tr><th>#</th><th>Descripción</th><th>Precio</th><th>Acción</th></tr></thead>
    <tbody>
      {% for key, p in productos.items() %}
      <tr class="fila-consumible">
        <td>{{ loop.index }}</td>
        <td>{{ p.titulo or p.descripcion }}</td>
        <td>{{ p.precio }}</td>
        <td><a class="btn btn-sm btn-primary" href="#">Ver</a></td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
